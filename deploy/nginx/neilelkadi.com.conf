# sites-available/neilelkadi.com.conf — Neil's personal site, static files on the proxy.
#
# Public: yes, orange-clouded in Cloudflare. The origin A record is the house WAN
# (kept current by the DDNS updater on CT 103); 80/443 are forwarded at the UDM to
# this container. This is the only vhost on the box that serves files instead of
# proxy_pass — everything else is a backend.
#
# Built on NeilDesktop, installed to /var/www/neilelkadi.com/current, which is a
# symlink into releases/<git-sha>. A content deploy flips that symlink and needs
# no reload here; only a change to this file does. See the repo's
# scripts/deploy.sh.
#
# The cert is NOT snippets/tls.conf: that snippet pins the *.theneil.zone
# wildcard, which never covers this domain. certbot maintains
# /etc/letsencrypt/live/neilelkadi.com/ through DNS-01 (dns-cloudflare), and the
# deploy hook in /etc/letsencrypt/renewal-hooks/deploy/ reloads nginx after each
# renewal.
#
# Cloudflare SSL/TLS mode is Full (strict), so the HTTP -> HTTPS 301 is safe; on
# Flexible it would loop.
#
# www.neilelkadi.com has no DNS record, so nothing else can match this block. If
# that ever changes: reissue with -d www.neilelkadi.com and add it to server_name.
# HSTS stays off for now, per snippets/security-headers.conf.

server {
    listen      80;
    listen      [::]:80;
    server_name neilelkadi.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name neilelkadi.com;

    ssl_certificate     /etc/letsencrypt/live/neilelkadi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neilelkadi.com/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    include /etc/nginx/snippets/security-headers.conf;

    root  /var/www/neilelkadi.com/current;
    index index.html;
    charset utf-8;

    # React Router owns unknown paths — the NotFound route lives in the app, so
    # nginx must hand them to index.html rather than answer 404 itself.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Create React App filenames under /static/ are content-hashed, so they can
    # be cached forever. index.html must never be cached: it is the file that
    # names those hashes, and a stale one points at JS the next release deleted.
    # add_header inside a location replaces everything inherited from the server
    # block, so each block re-includes the headers snippet.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log    off;
    }
}
